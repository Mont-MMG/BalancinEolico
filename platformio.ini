; Balancin eolico - Adquisicion para identificacion (ESP32-S3)
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    ; Si conectas la placa por el puerto "USB" (nativo) deja esto en 1.
    ; Si la conectas por el puerto "UART/COM", cambialo a 0.
    -DARDUINO_USB_CDC_ON_BOOT=1
